name: Super-Linter

on:
  push:
    branches:
      - main # or your default branch

jobs:
  super-lint:
    name: Lint code base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Super-Linter
        uses: github/super-linter@v5 #Use latest version
        env:
          DEFAULT_BRANCH: main # Corrected to main (or your default branch)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
